<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather Data</title>
		<link rel="stylesheet" href="style.css" />
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet" />
	</head>

	<body class="body2nd">
		<div id="page2nd" class="card col-sm-12 col-md-6 col-lg-6 col-12 text-center" style="width: 19rem">
			<div class="card-header">
				<h3 id="city"></h3>
			</div>
			<!-- <div id="img2nd"></div> -->

			<div class="card-body">
				<!-- <div>
                <h1 id="result"></h1>
            </div> -->
				<div id="response"></div>
				<!-- <div class="description" id="description"></div> -->
				<div class="maxmin">
					<div class="div">
						<p>Max: <span id="max"></span></p>
					</div>
					<div class="div">
						<p>Min: <span id="min"></span></p>
					</div>
				</div>

				<div class="d5 text-white">
					<h5>5-Days Forecast</h5>
				</div>

				<!-- <div class="footer">
            <div class="foot">
                <div class="today"><p><span class="text-white">Today</span></p></div>
                <div class="monthday">
                <div id="monthday" class="monthday text-white"><p><span class="text-white"></span></p></div>
                <div id="day"></div>
                </div>
            </div> -->
				<!-- <div class="hr"><hr> -->
				<div class="cast slider-container">
					<div class="left-arrow prev">
						<a href="Javascript:void(0)"><img src="../Images/🦆 icon _chevron left_.png" alt="" /></a>
					</div>

					<div class="slider">
						<div class="forecast1 ">
							<div class="fc1 text-white"></div>
							<div class="fc2"></div>
							<div class="fc3 text-white"></div>
						</div>

						<div class="forecast2 ">
							<div class="fc4 text-white"></div>
							<div class="fc5"></div>
							<div class="fc6 text-white"></div>
						</div>

						<div class="forecast3 ">
							<div class="fc7 text-white"></div>
							<div class="fc8"></div>
							<div class="fc9 text-white"></div>
						</div>

						<div class="forecast4 ">
							<div class="fc10 text-white"></div>
							<div class="fc11"></div>
							<div class="fc12 text-white"></div>
						</div>

						<div class="forecast5 ">
							<div class="fc13 text-white"></div>
							<div class="fc14"></div>
							<div class="fc15 text-white"></div>
						</div>
					</div>

					<div class="right-arrow next">
						<a href="Javascript:void(0)"><img src="../Images/🦆 icon _chevron right_.png" alt="" /></a>
					</div>
					<!-- <div class="right-arrow">
                        <img src="../Images/🦆 icon _chevron right_.png" alt="" />
                    </div> -->
				</div>
                
				<div class="mid-card">
					<div class="air">
						<div class="img"><img src="../Images/🦆 icon _crosshairs_.png" alt="" /></div>
						<div class="description text-white">
							<p>AIR QUALITY</p>
						</div>
					</div>
					<div>
						<h5 class="aqi text-white"></h5>
					</div>

					<div class="hr text-white">
						<hr />
					</div>
					<div class="seemore">
						<div class="see">
							<a href="https://openweathermap.org/api/air-pollution"><p class="text-white">See more</p></a>
						</div>
						<div class="arrow">
							<a href="https://openweathermap.org/api/air-pollution"><img src="../Images/🦆 icon _chevron small_arrow.png" alt="" /></a>
						</div>
					</div>
				</div>

				<div class="footer">
					<div class="foot1">
						<a href="Javascript:void(0)" class="foot1_anchor">
							<div class="inner1">
								<div class="icon1">
									<img src="../Images/Star 1.png" />
								</div>
								<div class="txt1">
									<p class="text-white">SUNRISE</p>
								</div>
							</div>
							<div class="inner2 text-white" id="sunrise"></div>
							<div class="inner3">
								<p class="text-white">Sunset:</p>
								<p class="sunset text-white"></p>
							</div>
						</a>
					</div>

					<div class="foot2">
						<a href="Javascript:void(0)" class="foot2_anchor">
                            <div class="inner4">
                                <div class="icon1">
                                    <img src="../Images/Star 1.png" />
                                </div>
                                <div class="txt1">
                                    <p class="text-white">UV INDEX</p>
                                </div>
                            </div>
                            <div class="inner5 text-white"></div>
                            <div class="inner6 text-white"></div>
                        </a>
					</div>
				</div>

				<div class="home">
					<a href="../index.html"><img src="../Images/🦆 icon _menu_.png" alt="" /></a>
				</div>
			</div>
		</div>

		<!-- Include Axios before your custom scripts -->
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
		<script src="wapp.mjs"></script>
        <!-- <script src="../Slider/app.js"></script> -->
	</body>
</html>
